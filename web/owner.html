<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#032449">
  <title>Owner · Parcelink</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Parcelink">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,700;1,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="Parcelink home"><img src="brand/logo-horizontal-light.webp" alt="Parcelink" width="230" height="34"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
      <a href="owner.html" aria-current="page">Owner</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>
  <main class="narrow stack">
    <div id="intro">
      <h1>Your locker</h1>
      <p class="lede">Enter the staff ID once. This phone then opens your dashboard. <a href="register.html">Need an ID?</a></p>
    </div>
    <p id="banner" class="banner hidden"></p>
    <form id="who" class="card">
      <div class="field">
        <label for="emp">Employee ID</label>
        <input id="emp" name="empId" autocomplete="off" required placeholder="EMP003">
      </div>
      <button class="full" type="submit">Open my dashboard</button>
    </form>
    <section id="dash" class="stack hidden">
      <div>
        <h1 id="dash-title">Your locker</h1>
        <p id="dash-lede" class="lede"></p>
      </div>
      <div class="actions">
        <button id="enable" class="secondary" type="button">Enable notifications</button>
        <button id="switch" class="secondary" type="button">Switch person</button>
      </div>
    </section>
    <p id="empty" class="hint hidden">Nothing in the locker.</p>
    <div id="list" class="stack"></div>
    <section id="history-wrap" class="stack hidden">
      <h2 class="history-title">History</h2>
      <div id="history" class="stack"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="js/owner.js"></script>
</body>
</html>
