<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#032449">
  <title>Delivery · Parcelink</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Parcelink">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,700;1,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="Parcelink home"><img src="brand/logo-horizontal-light.webp" alt="Parcelink" width="230" height="34"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
      <a href="owner.html">Owner</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>
  <main class="narrow stack">
    <div>
      <h1 id="title">Locker</h1>
      <p id="owner-line" class="lede">Checking this locker.</p>
    </div>
    <p id="error" class="banner bad hidden"></p>
    <form id="form" class="card">
      <div class="field">
        <label for="company">Courier company</label>
        <input id="company" name="courierCompany" required placeholder="J&amp;T Express">
      </div>
      <div class="field">
        <label for="reference">Tracking number <span class="hint">optional</span></label>
        <input id="reference" name="reference" placeholder="JT123456">
      </div>
      <div class="field">
        <label for="photo">Photo evidence</label>
        <input id="photo" name="photo" type="file" accept="image/*" capture="environment" required>
        <img id="preview" class="preview hidden" alt="Selected parcel photo">
      </div>
      <button id="submit" class="full" type="submit">Confirm</button>
    </form>
    <section id="unlocked" class="unlock hidden">
      <p class="eyebrow">Locker</p>
      <h1>Locker unlocked</h1>
      <p>Place the parcel in the box and close the door.</p>
      <button id="close-door" type="button">Door closed</button>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="js/drop.js"></script>
</body>
</html>
